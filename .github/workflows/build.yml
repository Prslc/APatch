name: Build Manager

on:
  push:
    tags: [ "*" ]
    branches: [ "miuix" ]
    paths:
      - '.github/workflows/build.yml'
      - 'app/**'
      - 'apd/**'
      - 'build.gradle.kts'
      - 'gradle/libs.versions.toml'
  pull_request:
    branches: [ "miuix" ]
    paths:
      - '.github/workflows/build.yml'
      - 'app/**'
      - 'apd/**'
      - 'build.gradle.kts'
      - 'gradle/libs.versions.toml'
  workflow_call:
  workflow_dispatch:

jobs:
  build-manager:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Generate version
        id: parse_version
        run: |
          COMMIT_NUM=$(git rev-list --count HEAD)
          VERSION=$(echo "$COMMIT_NUM + 200 + 10000" | bc)
          echo "Generated Version: $VERSION"
          echo "VERSION=$VERSION" >> $GITHUB_OUTPUT

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          java-version: 21

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: ''

      - name: Install toolchain
        run: |
          rustup update stable
          cargo install cargo-ndk --locked || true
          rustup target install aarch64-linux-android

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: apd
          cache-targets: false

      - name: Write key
        run: |
          if [ -n "${{ secrets.SIGNING_KEY }}" ]; then
            echo "KEYSTORE_PASSWORD=${{ secrets.KEY_STORE_PASSWORD }}" >> gradle.properties
            echo "KEY_ALIAS=${{ secrets.ALIAS }}" >> gradle.properties
            echo "KEY_PASSWORD=${{ secrets.KEY_PASSWORD }}" >> gradle.properties
            echo "KEYSTORE_FILE=key.jks" >> gradle.properties
            echo "${{ secrets.SIGNING_KEY }}" | base64 -d > key.jks
          fi

      - name: Get KernelPatch Info
        id: kp_info
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          KP_VERSION=$(grep -oP 'kernelPatchVersion",\s*"\K[^"]+' build.gradle.kts)
          echo "KP_VERSION=$KP_VERSION" >> $GITHUB_OUTPUT

          # Get the latest asset updated_at via GitHub API — when KP replaces
          # release files without recreating the tag, assets always reflect it
          RELEASE_JSON=$(gh api "repos/bmax121/KernelPatch/releases/tags/$KP_VERSION")
          ASSET_UPDATED=$(echo "$RELEASE_JSON" | jq -r '.assets | map(.updated_at) | sort | last')
          echo "Latest asset updated at: $ASSET_UPDATED"

          # Get the latest commit on main before the asset update time
          KP_HASH=$(gh api "repos/bmax121/KernelPatch/commits?until=$ASSET_UPDATED&per_page=1" \
            --jq '.[0].sha' | cut -c1-7)
          echo "KP_HASH=$KP_HASH" >> $GITHUB_OUTPUT

          # Pass to Gradle via system property
          echo "org.gradle.jvmargs=-Xmx2048m -DkpHash=$KP_HASH" >> gradle.properties

      - name: Build with Gradle
        run: |
          echo "org.gradle.parallel=true" >> gradle.properties
          echo "org.gradle.vfs.watch=true" >> gradle.properties
          echo "android.native.buildOutput=verbose" >> gradle.properties
          sed -i '/org.gradle.configuration-cache/d' gradle.properties
          # Only set jvmargs if not already set by the KP info step
          grep -q '^org.gradle.jvmargs=' gradle.properties || \
            echo "org.gradle.jvmargs=-Xmx2048m" >> gradle.properties
          ./gradlew assembleRelease

      - name: Upload mappings
        uses: actions/upload-artifact@v7
        with:
          name: "mappings"
          path: "app/build/outputs/mapping/release/"

      - name: Post to Telegram
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          GITHUB_EVENT_PATH: ${{ github.event_path }}
          BRANCH: ${{ github.ref_name }}
          VERSION: "${{ steps.parse_version.outputs.VERSION }}"
          KP_VERSION: "${{ steps.kp_info.outputs.KP_VERSION }}"
          KP_HASH: "${{ steps.kp_info.outputs.KP_HASH }}"
          RUN_URL: "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
        run: |
          APK_PATH=$(ls app/build/outputs/apk/release/*.apk | head -n 1)
          python3 .github/scripts/telegram_bot.py "${{ secrets.CHANNEL_ID }}" "$APK_PATH"