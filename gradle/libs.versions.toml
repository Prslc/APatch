[versions]
agp = "9.3.2"
lsplugin-apksign = "1.4"
lsplugin-resopt = "1.6"
kotlin = "2.4.10"
compose-bom = "2026.08.00"
material3 = "1.5.0-alpha27"
material-kolor = "5.0.1"
activity-compose = "1.13.0"
splashscreen = "1.2.0"
webkit = "1.17.0"
lifecycle = "2.11.0"
libsu = "6.0.0"
miuix = "0.9.3"
navigation-compose = "2.10.0"
okhttp = "5.5.0"
parcelablelist = "2.0.1"
coroutines = "1.11.0"
appiconloader = "1.5.1"
markdown = "4.6.2"
ini4j = "0.5.4"
cxx = "29.0.14206865"
coil3 = "3.6.0"

[plugins]
agp-app = { id = "com.android.application", version.ref = "agp" }
lsplugin-apksign = { id = "org.lsposed.lsplugin.apksign", version.ref = "lsplugin-apksign" }
lsplugin-resopt = { id = "org.lsposed.lsplugin.resopt", version.ref = "lsplugin-resopt" }
kotlin-compose-compiler = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }

[libraries]
androidx-activity-compose = { group = "androidx.activity", name = "activity-compose", version.ref = "activity-compose" }
androidx-core-splashscreen = { group = "androidx.core", name = "core-splashscreen", version.ref = "splashscreen" }
androidx-webkit = { group = "androidx.webkit", name = "webkit", version.ref = "webkit" }

androidx-compose-bom = { group = "androidx.compose", name = "compose-bom", version.ref = "compose-bom" }
androidx-compose-material-icons-extended = { group = "androidx.compose.material", name = "material-icons-extended" }
androidx-compose-ui = { group = "androidx.compose.ui", name = "ui" }
androidx-compose-ui-test-manifest = { group = "androidx.compose.ui", name = "ui-test-manifest" }
androidx-compose-ui-tooling = { group = "androidx.compose.ui", name = "ui-tooling" }
androidx-compose-ui-tooling-preview = { group = "androidx.compose.ui", name = "ui-tooling-preview" }
androidx-compose-runtime-livedata = { group = "androidx.compose.runtime", name = "runtime-livedata" }
androidx-compose-material3 = { group = "androidx.compose.material3", name = "material3", version.ref = "material3" }
androidx-navigation-compose = { group = "androidx.navigation", name = "navigation-compose", version.ref = "navigation-compose" }

material-kolor = { module = "com.materialkolor:material-kolor", version.ref = "material-kolor" }

# miuix
miuix-ui = { group = "top.yukonga.miuix.kmp", name= "miuix-ui-android", version.ref = "miuix"}
miuix-blur = { group = "top.yukonga.miuix.kmp", name = "miuix-blur-android", version.ref = "miuix" }
miuix-icons = { group = "top.yukonga.miuix.kmp", name = "miuix-icons-android", version.ref = "miuix"}
miuix-preference = { group = "top.yukonga.miuix.kmp", name = "miuix-preference-android", version.ref = "miuix" }

# okhttp
okhttp = { module = "com.squareup.okhttp3:okhttp", version.ref = "okhttp" }

androidx-lifecycle-runtime-ktx = { group = "androidx.lifecycle", name = "lifecycle-runtime-ktx", version.ref = "lifecycle" }
androidx-lifecycle-runtime-compose = { group = "androidx.lifecycle", name = "lifecycle-runtime-compose", version.ref = "lifecycle" }
androidx-lifecycle-viewmodel-compose = { group = "androidx.lifecycle", name = "lifecycle-viewmodel-compose", version.ref = "lifecycle" }

com-github-topjohnwu-libsu-core = { group = "com.github.topjohnwu.libsu", name = "core", version.ref = "libsu" }
com-github-topjohnwu-libsu-service = { group = "com.github.topjohnwu.libsu", name = "service", version.ref = "libsu" }
com-github-topjohnwu-libsu-nio = { group = "com.github.topjohnwu.libsu", name = "nio", version.ref = "libsu" }
com-github-topjohnwu-libsu-io = { group = "com.github.topjohnwu.libsu", name = "io", version.ref = "libsu" }

dev-rikka-rikkax-parcelablelist = { group = "dev.rikka.rikkax.parcelablelist", name = "parcelablelist", version.ref = "parcelablelist" }

kotlinx-coroutines-core = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-core", version.ref = "coroutines" }

coil3 = { group = "io.coil-kt.coil3", name = "coil-compose", version.ref = "coil3" }

appiconloader = { group = "io.github.prslc.android.appiconloader", name = "appiconloader-coil3", version.ref = "appiconloader" }

markdown = { group = "io.noties.markwon", name = "core", version.ref = "markdown" }

ini4j = { group = "org.ini4j", name = "ini4j", version.ref = "ini4j" }

cxx = { group = "org.lsposed.libcxx" ,name = "libcxx", version.ref = "cxx" }
